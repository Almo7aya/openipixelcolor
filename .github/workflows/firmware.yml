# Every push and pull request: build the firmware, run the simulator tests, check the web UI.
# On main it also
#  - publishes a release when something under firmware/ changed. Versions are single numbers: the next
#    one after the newest tag vN (v100, v101, ...), built into the firmware (make FW_VERSION=N),
#  - publishes the web UI on the gh-pages branch (GitHub Pages) together with the latest release's
#    update file and firmware/latest.json, so the hosted page can install it.
# "Run workflow" (manual) republishes the page and can force a release.
name: Firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a firmware release even if nothing under firmware/ changed
        type: boolean
        default: false

permissions:
  contents: write          # releases, the gh-pages branch
  pages: read              # the page's address for the release notes

# one run at a time per branch: two quick pushes can't pick the same version number
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    # Arch Linux packages the same cross compiler the firmware is developed with (nds32le-elf-gcc 15.x)
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
      firmware_changed: ${{ steps.changes.outputs.firmware }}
    steps:
      # pacman's downloaded packages are kept between runs, so the toolchain isn't downloaded every time.
      # A new cache each week (restored from the last one), trimmed to what's installed so it doesn't grow.
      - name: Week of the package cache
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Package cache
        uses: actions/cache@v6
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ steps.week.outputs.week }}
          restore-keys: pacman-

      - name: Install the toolchain
        run: |
          pacman -Syu --noconfirm --needed nds32le-elf-gcc nds32le-elf-binutils clang lld python nodejs git
          pacman -Sc --noconfirm > /dev/null       # drop cached packages that aren't installed
          du -sh /var/cache/pacman/pkg

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: What changed since the last release
        id: changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          last=$(git tag -l 'v*' --sort=-creatordate | head -n 1)
          if [ -n "$last" ]; then files=$(git diff --name-only "$last" "$GITHUB_SHA" -- firmware/)
          else files=$(git ls-files firmware/); fi
          if [ -n "$files" ]; then echo firmware=true; else echo firmware=false; fi >> "$GITHUB_OUTPUT"
          echo "under firmware/ since ${last:-the start}:"
          echo "${files:-nothing changed}"

      - name: Version number
        id: version
        run: |
          last=$(git tag -l 'v*' | sed -n 's/^v\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n 1)
          echo "version=$(( ${last:-99} + 1 ))" >> "$GITHUB_OUTPUT"
          echo "newest release tag: v${last:-none}"

      - name: Toolchain versions
        run: |
          nds32le-elf-gcc --version | head -n 1
          nds32le-elf-ld --version | head -n 1

      - name: Build the firmware
        run: make -C firmware EXTRA_CFLAGS=-Werror FW_VERSION=${{ steps.version.outputs.version }}

      - name: Simulator tests
        working-directory: tools/sim
        run: |
          gcc -O2 -std=gnu11 -Wall -Wextra -Werror -I../../firmware/src/app sim.c \
              ../../firmware/src/app/{gfx,effects,fx_more,modes,clockface,tables,font5x7,settings,textfx,anim,screens}.c -o sim
          ./sim settings
          node anim_vectors.js vec
          ./sim anim vec
          ./sim > /dev/null

      - name: Check the web UI
        run: node tools/ci/check_webui.js

      # the panel preview runs the firmware's display code in the browser: built from this commit's sources
      - name: Build the panel preview (WebAssembly)
        run: |
          mkdir -p web
          python tools/wasm/build.py --out web/panel.wasm

      - uses: actions/upload-artifact@v7
        with:
          name: panel-wasm
          path: web/
          if-no-files-found: error

      - name: Collect the firmware files
        env:
          v: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp firmware/build/fw.ota.bin "dist/openipixelcolor-$v.ota.bin"
          cp firmware/build/fw.bin "dist/openipixelcolor-$v.bin"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: openipixelcolor-firmware
          path: dist/
          if-no-files-found: error

  publish:
    name: Release and web page
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      RELEASE: ${{ (github.event_name == 'push' && needs.build.outputs.firmware_changed == 'true') || (github.event_name == 'workflow_dispatch' && inputs.release) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: openipixelcolor-firmware
          path: dist

      - uses: actions/download-artifact@v7
        with:
          name: panel-wasm
          path: web

      - name: Publish a release
        if: env.RELEASE == 'true'
        run: |
          tag="v$VERSION"
          prev=$(gh release list --limit 1 --json tagName -q '.[0].tagName' || true)
          page=$(gh api "repos/$GITHUB_REPOSITORY/pages" -q .html_url 2>/dev/null || echo "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/")
          page="https://${page#*://}"                 # Web Bluetooth needs HTTPS
          {
            echo "Firmware $VERSION built from ${GITHUB_SHA::7}."
            echo
            echo "Install it from the web page: $page (Chrome or Edge, **Device**, **Use the latest release**)."
            echo "\`openipixelcolor-$VERSION.ota.bin\` is the update file, \`openipixelcolor-$VERSION.bin\` the raw image."
            echo
            echo "Firmware changes:"
            if [ -n "$prev" ] && git rev-parse -q --verify "$prev^{commit}" >/dev/null; then
              git log --format='- %s' "$prev..$GITHUB_SHA" -- firmware/
            else
              git log -n 20 --format='- %s' "$GITHUB_SHA" -- firmware/
            fi
          } > notes.md
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "openipixelcolor $VERSION" \
             --notes-file notes.md --latest

      - name: Firmware for the web page
        run: |
          mkdir -p fw
          if [ "$RELEASE" = true ]; then
            tag="v$VERSION"
            cp dist/*.ota.bin fw/
          else                                   # nothing new: keep offering the latest release
            tag=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
            if [ -n "$tag" ]; then gh release download "$tag" --pattern '*.ota.bin' --dir fw; fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          ls -l fw

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r webui/. site/
          rm -f site/serve.py
          cp web/panel.wasm site/panel.wasm          # built from this commit, not the copy in the repository
          mkdir -p site/firmware
          touch site/.nojekyll
          f=$(ls fw/*.ota.bin 2>/dev/null | head -n 1 || true)
          if [ -n "$f" ]; then
            name=$(basename "$f")
            cp "$f" "site/firmware/$name"
            v=${TAG#v}; v=${v%%-*}
            printf '{"version":"%s","tag":"%s","file":"%s","size":%d,"date":"%s","release":"%s"}\n' \
              "$v" "$TAG" "$name" "$(stat -c %s "$f")" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" > site/firmware/latest.json
            cat site/firmware/latest.json
          fi
          find site -type f | sort

      - name: Push to gh-pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "$url" pages
          else
            git init --quiet -b gh-pages pages
            git -C pages remote add origin "$url"
          fi
          find pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a site/. pages/
          cd pages
          git add -A
          if git diff --cached --quiet; then echo "the page is up to date"; exit 0; fi
          git commit --quiet -m "Web UI from ${GITHUB_SHA::7}${TAG:+, firmware $TAG}"
          git push --quiet origin gh-pages
